# maker-arm02: J2/J3 are RS02 (mapped ±17Nm/±44rad/s), the rest are RS00.
# ⚠️ RS02 firmware ≤0.2.2.11 maps position to ±12.5 rad (the SDK assumes the newer
#    firmware's ±12.57) -- as the first bring-up step, check the firmware version with
#    READ_VERSION and upgrade first if it's too old.
# direction/offset/lo/hi are placeholders: fill them in per the README bring-up sequence
# (monitor to verify direction by hand -> set_zero -> monitor, press Enter to capture limits).
control_rate_hz: 200
max_velocity: 9.0          # verified value from bench teleop (1.0 feels sluggish)
limit_margin: 0.05
feedback_timeout: 0.2
motor_can_timeout_ms: 200
# kp/kd for motors 3~7 are values verified on the bench on 2026-08-07 (hold / sine / teleop
# tracking all passed); 1~2 are placeholders, tune the same way once wired up. After full
# assembly J2/J3 (RS02) carrying load may need a higher kp.
joints:
  - {motor_id: 1, model: RS00, direction: 1, offset: 0.0, lo: -2.864, hi: 2.636, kp: 60, kd: 4.0}
  - {motor_id: 2, model: RS02, direction: 1, offset: 0.0, lo: -2.08, hi: -0.039, kp: 150, kd: 4.5}
  - {motor_id: 3, model: RS02, direction: 1, offset: 0.0, lo: 0.045, hi: 4.106, kp: 90, kd: 3.0}
  - {motor_id: 4, model: RS00, direction: 1, offset: 0.0, lo: -1.648, hi: 1.151, kp: 30, kd: 2.0}
  - {motor_id: 5, model: RS00, direction: 1, offset: 0.0, lo: -1.378, hi: 1.714, kp: 30, kd: 2.0}
  - {motor_id: 6, model: RS00, direction: 1, offset: 0.0, lo: -2.546, hi: 2.791, kp: 30, kd: 2.0}
  - {motor_id: 7, model: RS00, direction: 1, offset: 0.0, lo: -2.076, hi: -0.039, kp: 20, kd: 0.5}  # gripper: MIT mode, grip force = kp x position error, small kp = compliant force limiting
