# maker-arm 6×RS00 关节配置。direction/offset/lo/hi 为占位，
# bring-up 流程：tools/monitor.py 手推核对方向 → tools/set_zero.py 标零 → 填实限位。
control_rate_hz: 200
max_velocity: 1.5
limit_margin: 0.05
feedback_timeout: 0.2
motor_can_timeout_ms: 200
joints:
  - {motor_id: 1, direction: 1, offset: 0.0, lo: -3.0, hi: 3.0, kp: 60, kd: 2.0}
  - {motor_id: 2, direction: 1, offset: 0.0, lo: -3.0, hi: 3.0, kp: 80, kd: 3.0}
  - {motor_id: 3, direction: 1, offset: 0.0, lo: -3.0, hi: 3.0, kp: 80, kd: 3.0}
  - {motor_id: 4, direction: 1, offset: 0.0, lo: -3.0, hi: 3.0, kp: 40, kd: 1.0}
  - {motor_id: 5, direction: 1, offset: 0.0, lo: -3.0, hi: 3.0, kp: 40, kd: 1.0}
  - {motor_id: 6, direction: 1, offset: 0.0, lo: -3.0, hi: 3.0, kp: 40, kd: 1.0}
