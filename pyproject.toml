[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maker-arm"
version = "0.1.0"
description = "Python SDK for a 6x RobStride RS00 robot arm (teleop-first)"
requires-python = ">=3.10"
dependencies = ["numpy", "pyserial", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["maker_arm*"]
