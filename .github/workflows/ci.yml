name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # The tests run real control loops against simulated motors on the wall clock; a starved
      # runner can trip their watchdogs, so failures get one rerun.
      - run: python -m pytest -q || python -m pytest -q --last-failed
        shell: bash
      - run: maker-arm --help
      - run: maker-arm doctor
