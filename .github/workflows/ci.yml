name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly at 10:00 UTC, so a dependency release that breaks the suite shows up within a day.
    - cron: "0 10 * * *"
  workflow_dispatch:

# A newer push to a pull request replaces the run still going for the older one. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The gate, on every pull request: Linux on Python 3.10 and 3.12, macOS on 3.12.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # The tests run real control loops against simulated motors on the wall clock; a starved
      # runner can trip their watchdogs, so failures get one rerun.
      - run: python -m pytest -q || python -m pytest -q --last-failed
        shell: bash
      - run: maker-arm --help
      - run: maker-arm doctor

  # Windows runs on main, nightly and on request: a break is reported within a day without holding up a pull request.
  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # The tests run real control loops against simulated motors on the wall clock; a starved
      # runner can trip their watchdogs, so failures get one rerun.
      - run: python -m pytest -q || python -m pytest -q --last-failed
        shell: bash
      - run: maker-arm --help
      - run: maker-arm doctor
