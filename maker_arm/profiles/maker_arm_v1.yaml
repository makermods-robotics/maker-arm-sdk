# Maker Arm v1 follower, MIT protocol only. Mirrors MakerModsLab exactly:
#   limits, models and gains: LeRobot MakerFollowerConfig (makermods-robotics/lerobot@5ce2fe41a)
#   gripper open bound -96 deg and gripper protection: MakerModsLab gripper_settings.py /
#   maker_gripper_hold.py
# Zero pose (set with `maker-arm zero`): folded against the base, gripper fully closed.
# Limits are the vendor's stop captures with a 0.05 rad backoff, in motor degrees.
# RS02 (J2/J3) firmware <=0.2.2.11 maps position to ±12.5 rad instead of ±12.57; check
# firmware during bring-up.
host_id: 253
required_motor_ids: [1, 2, 3, 4, 5, 6, 7]
control_rate_hz: 200
max_velocity: 5.0          # rad/s command rate limit (teleop-verified on macOS SLCAN)
limit_margin: 0.0
feedback_timeout: 0.25     # MakerModsLab teleop safety: feedback older than 250 ms stops
fault_poll_interval: 0.25  # MakerModsLab gripper fault poll period
joints:
  - {name: shoulder_pan,  motor_id: 1, model: RS00, limits_deg: [-158.2, 156.1], kp: 60,  kd: 4.0}
  - {name: shoulder_lift, motor_id: 2, model: RS02, limits_deg: [-175.3, -3.2],  kp: 150, kd: 4.5}
  - {name: elbow_flex,    motor_id: 3, model: RS02, limits_deg: [2.8, 236.1],    kp: 90,  kd: 3.0}
  - {name: wrist_flex,    motor_id: 4, model: RS00, limits_deg: [-65.2, 104.0],  kp: 30,  kd: 2.0}
  - {name: wrist_yaw,     motor_id: 5, model: RS00, limits_deg: [-97.6, 78.0],   kp: 30,  kd: 2.0}
  - {name: wrist_roll,    motor_id: 6, model: RS00, limits_deg: [-153.2, 152.0], kp: 30,  kd: 2.0}
  # Gripper: closes toward increasing angle, 0 = fully closed. As MakerModsLab (default gripper
  # hold on): closing effort capped at 1 Nm and grip regulated to 0.5 Nm on contact; 500 ms
  # motor watchdog (firmware >=0.0.3.27); stop at 55 °C, no enable unless below 45 °C; warning
  # or fault flag stops it; released (not held) on fault; excluded from the rest return.
  - name: gripper
    motor_id: 7
    model: RS00
    limits_deg: [-96.0, -2.5]
    kp: 20
    kd: 0.5
    can_timeout_ms: 500
    max_temperature_c: 55
    enable_temperature_c: 45
    return_to_rest: false
    release_on_fault: true
    warning_is_fault: true
    hold_torque_nm: 0.5
    closing_direction: 1
